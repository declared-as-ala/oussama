services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qualiflow-backend
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "10000:10000"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:10000
      RabbitMqSettings__Enabled: "true"
      RabbitMqSettings__HostName: rabbitmq
      RabbitMqSettings__Port: "5672"
      RabbitMqSettings__UserName: ${RABBITMQ_DEFAULT_USER:-qualiflow}
      RabbitMqSettings__Password: ${RABBITMQ_DEFAULT_PASS:-qualiflow123}
      RabbitMqSettings__VirtualHost: /
      RabbitMqSettings__QueueName: qualiflow.notifications
      OpenRouter__ApiKey: ${GROQ_API_KEY:-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}
      OpenRouter__Model: llama-3.3-70b-versatile
      OpenRouter__ApiBaseUrl: https://api.groq.com/openai/v1
    volumes:
      - qualiflow-storage:/app/StorageFiles

  rabbitmq:
    image: rabbitmq:3-management
    container_name: qualiflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-qualiflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-qualiflow123}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  qualiflow-storage:
  rabbitmq-data:
