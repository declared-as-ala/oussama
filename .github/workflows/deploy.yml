name: Build & Deploy QualiFlow

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        default: "latest"
        required: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/qualiflow-backend
  FRONTEND_IMAGE: ${{ github.repository }}/qualiflow-frontend

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Build and push Docker images to GHCR
  # ─────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tag
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${SHA_SHORT}" >> $GITHUB_OUTPUT

      # Backend image
      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: ./qualiflow-backend
          file: ./qualiflow-backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # Frontend image
      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./qualiflow-frontend
          file: ./qualiflow-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ─────────────────────────────────────────────────────────
  # Job 2: Deploy to VPS via SSH
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "docker-compose.yml"
          target: "/opt/qualiflow"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 120s
          command_timeout: 300s
          script: |
            set -e
            apt-get update && apt-get install -y sshpass
            cd /opt/qualiflow
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export REGISTRY=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
            export TAG=${{ needs.build.outputs.tag }}
            docker compose pull backend frontend
            docker compose up -d --remove-orphans
            docker system prune -f --filter "until=24h"
            echo "Deployed tag $TAG successfully"
