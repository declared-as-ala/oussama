# Map Connection header for WebSocket upgrade support
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream qualiflow_backend {
    # ip_hash ensures sticky sessions — helps stability for SignalR.
    ip_hash;
    server qualiflow-backend:10000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── REST API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://qualiflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  90s;
        proxy_send_timeout  90s;
    }

    # ── SignalR WebSocket Hub ─────────────────────────────────────────────
    # proxy_buffering OFF is required for WebSocket / SSE streaming.
    # $connection_upgrade map handles HTTP/1.0 clients gracefully.
    location /hubs/ {
        proxy_pass         http://qualiflow_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering — required for WebSocket / SSE streaming
        proxy_buffering    off;
        proxy_cache_bypass $http_upgrade;

        # Long timeouts for persistent WebSocket connections (1 hour)
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Prevent Nginx from closing idle WebSocket connections
        proxy_socket_keepalive on;
    }

    # ── Swagger ───────────────────────────────────────────────────────────
    location /swagger/ {
        proxy_pass http://qualiflow_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health check ──────────────────────────────────────────────────────
    location /health {
        proxy_pass http://qualiflow_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Angular SPA ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static assets caching ─────────────────────────────────────────────
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|mp3)$ {
        expires 6M;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}